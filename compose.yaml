  services:
    db-postgresql:
      container_name: db-postgresql
      image: postgres:18
      restart: unless-stopped
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: admin
        POSTGRES_DB: dbkitnet
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql
      networks:
        - network-kitnet

  volumes:
    pgdata:

  networks:
    network-kitnet:
      driver: bridge