spring:
  application:
    name: api-kitnet

  datasource:
    url: jdbc:postgresql://localhost:5432/dbkitnet
    username: admin
    password: admin

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

server:
  port: 8082

kitnet:
  viacep:
    base-url: https://viacep.com.br/ws
    connect-timeout: 3s
    read-timeout: 5s