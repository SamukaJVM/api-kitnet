spring:
  application:
    name: api-kitnet

server:
  port: 8082

  datasource:
    url: jdbc:postgresql://localhost:5432/dbkitnet
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration
